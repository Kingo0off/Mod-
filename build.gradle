plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'ru.atl.skills'
version = '0.3.2'
base { archivesName = 'atl-skills' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories { mavenCentral() }
neoForge {
    version = '26.3.0.118'
    runs { server { server(); programArgument '--nogui' } }
    mods { atl_skills { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.atl_skills }
}
dependencies { testImplementation 'net.neoforged:testframework:26.3.0.118'; testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

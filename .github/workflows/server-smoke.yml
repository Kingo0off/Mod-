name: Проверка запуска сервера
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Запустить тестовый сервер
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path run, run/server | Out-Null
          Set-Content -Path run/eula.txt -Value 'eula=true'
          Set-Content -Path run/server/eula.txt -Value 'eula=true'
          $out = Join-Path $env:RUNNER_TEMP 'atl-server-out.log'
          $err = Join-Path $env:RUNNER_TEMP 'atl-server-err.log'
          $process = Start-Process -FilePath 'gradle.bat' -ArgumentList 'runServer', '--no-daemon' -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
          $started = $false
          try {
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $out) {
                $log = Get-Content -Raw $out -ErrorAction SilentlyContinue
                if ($log -match 'Done \([0-9.]+s\)!') { $started = $true; break }
                if ($log -match 'Mixin apply failed|MixinTransformerError|Failed to start the minecraft server|BUILD FAILED') { break }
              }
              $process.Refresh()
              if ($process.HasExited) { break }
            }
            if (-not $started) {
              if (Test-Path $out) { Get-Content $out }
              if (Test-Path $err) { Get-Content $err }
              throw 'Сервер не подтвердил успешный запуск за 180 секунд'
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

name: Сборка мода
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Тесты и сборка
        run: gradle --no-daemon test build
      - name: Сохранить jar
        uses: actions/upload-artifact@v4
        with:
          name: ATL-Skills
          path: build/libs/atl-skills-*.jar
          if-no-files-found: error
      - name: Опубликовать тестовую версию
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-beta.1
          name: ATL Skills 0.2.0 — тестовая версия
          prerelease: true
          body: |
            Тестовая версия с меню навыков, уведомлениями и подсказками предметов для Minecraft 26.3 и NeoForge.
            Проверено: компиляция и автоматические тесты уровней. Работу в игре и на сервере ещё нужно проверить.
            Перед испытанием сделайте резервную копию мира.
          files: build/libs/atl-skills-*.jar

name: Сборка мода
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Тесты и сборка
        run: gradle --no-daemon test build
      - name: Сохранить jar
        uses: actions/upload-artifact@v4
        with:
          name: ATL-Skills
          path: build/libs/atl-skills-*.jar
          if-no-files-found: error
      - name: Опубликовать тестовую версию
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1-beta.1
          name: ATL Skills 0.3.1 — тестовая версия
          prerelease: true
          body: |
            Исправлен выбор зачарований левой кнопкой мыши в Minecraft 26.3.
            В столе показываются только ванильные зачарования, подходящие предмету и совместимые с уже наложенными чарами. Для кирки исключены чары оружия.
            Цена выбранного зачарования — один лазурит и один уровень опыта. Список прокручивается колесом мыши.
            Проверены сборка, автоматические тесты и запуск выделенного сервера на Windows. Интерфейс и взаимодействие в игре вручную не проверялись.
            Перед испытанием сделайте резервную копию мира.
          files: build/libs/atl-skills-*.jar

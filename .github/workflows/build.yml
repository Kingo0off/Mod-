name: Сборка мода
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Тесты и сборка
        run: gradle --no-daemon test build
      - name: Сохранить jar
        uses: actions/upload-artifact@v4
        with:
          name: ATL-Skills
          path: build/libs/atl-skills-*.jar
          if-no-files-found: error
      - name: Опубликовать тестовую версию
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-beta.1
          name: ATL Skills 0.4.0 — тестовая версия
          prerelease: true
          body: |
            Обновлён стол зачарования: жёлтым показаны необходимые книжные полки, зелёным — уровни игрока. Конфликтующие чары затемнены, при наведении отображается описание.
            За выбор также расходуется один лазурит. Число доступных полок и выбор проверяются сервером.
            Зажмите Shift над зачарованным предметом, чтобы увидеть прогресс каждого чара. Более редкие чары требуют больше опыта использования; сохранённый опыт не сбрасывается.
            На сервере и клиенте требуется одна и та же версия мода.
            Проверены автоматические тесты и запуск выделенного сервера на Windows; отображение и управление в игре вручную не проверялись.
            Перед испытанием сделайте резервную копию мира.
          files: build/libs/atl-skills-*.jar

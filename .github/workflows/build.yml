name: Сборка мода
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Тесты и сборка
        run: gradle --no-daemon test build
      - name: Сохранить jar
        uses: actions/upload-artifact@v4
        with:
          name: ATL-Skills
          path: build/libs/atl-skills-*.jar
          if-no-files-found: error
      - name: Опубликовать тестовую версию
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-beta.1
          name: ATL Skills 0.3.0 — тестовая версия
          prerelease: true
          body: |
            Тестовая версия для Minecraft 26.3 и NeoForge.
            В столе зачарования можно выбрать подходящие совместимые чары I уровня: прокручивайте список колесом мыши. Цена — один лазурит и один уровень игрока.
            Чары получают опыт отдельно на предмете при его использовании с расходом прочности; прогресс показан в подсказке.
            Добавлены настройка клавиши, анимированная плашка уровня и новый баланс навыков.
            Проверены сборка, автоматические тесты и запуск выделенного сервера на Windows. Игровой клиент и сетевой игровой процесс вручную не проверялись.
            Перед испытанием сделайте резервную копию мира.
          files: build/libs/atl-skills-*.jar

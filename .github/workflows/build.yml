name: Сборка мода
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Тесты и сборка
        run: gradle --no-daemon test build
      - name: Сохранить jar
        uses: actions/upload-artifact@v4
        with:
          name: ATL-Skills
          path: build/libs/atl-skills-*.jar
          if-no-files-found: error
      - name: Опубликовать тестовую версию
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1-beta.1
          name: ATL Skills 0.4.1 — тестовая версия
          prerelease: true
          body: |
            Для Удачи, Добычи и других сильных чар нужно 25 правильно расположенных книжных полок. Острота требует 10 полок и 10 уровней игрока.
            Пороги прокачки чар оружия и инструментов повышены, пороги брони сохранены. Полоска прогресса и процент отображаются при удержании Shift.
            Уже накопленный опыт предметов сохраняется. Требования проверяются сервером.
            Сборка, автоматические тесты и запуск выделенного сервера проверяются на Windows; отображение и игровой процесс вручную не проверялись.
            Перед испытанием сделайте резервную копию мира и установите одинаковую версию мода на сервере и клиенте.
          files: build/libs/atl-skills-*.jar
